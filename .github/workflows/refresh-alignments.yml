name: Refresh alignment source units

on:
  push:
    paths:
      - "scripts/fetch_pali_bilara.sh"
      - "scripts/build_pali_units.py"
      - "scripts/build_chinese_alignment_units.py"
      - "scripts/generate_alignment_candidates.py"
      - "scripts/generate_anchor_window_candidates.py"
      - "scripts/validate_alignments.py"
      - "schemas/alignment.schema.json"
      - "tests/test_pali_units.py"
      - "tests/test_chinese_alignment_units.py"
      - "tests/test_alignment_candidates.py"
      - "tests/test_anchor_window_candidates.py"
      - "data/alignments/**"
      - "generated/crosswalks/first-20-resolved.json"
      - "sources/lock.json"
      - ".gitmodules"
      - ".github/workflows/refresh-alignments.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Fetch pinned Pāli Bilara files
        run: ./scripts/fetch_pali_bilara.sh .cache/bilara-pali

      - name: Fetch pinned CBETA Āgama files
        run: ./scripts/fetch_cbeta_agamas.sh .cache/cbeta-agamas

      - name: Build Pāli source units
        shell: bash
        run: |
          set -euo pipefail
          BILARA_SHA="$(git ls-files -s upstream/suttacentral-bilara | awk '{print $2}')"
          rm -rf generated/alignment-source/pali
          python scripts/build_pali_units.py             --bilara-root .cache/bilara-pali             --crosswalks data/crosswalks/first-20.json             --revision "$BILARA_SHA"             --output generated/alignment-source/pali             --strict

      - name: Build Chinese source units
        run: |
          rm -rf generated/alignment-source/chinese
          python scripts/build_chinese_alignment_units.py             --cbeta-root .cache/cbeta-agamas             --resolved-crosswalks generated/crosswalks/first-20-resolved.json             --output generated/alignment-source/chinese             --strict

      - name: Generate non-established alignment candidates
        run: |
          rm -rf generated/alignments
          python scripts/generate_alignment_candidates.py             --pali-units generated/alignment-source/pali/units.jsonl             --chinese-blocks generated/alignment-source/chinese/blocks.jsonl             --resolved-crosswalks generated/crosswalks/first-20-resolved.json             --output generated/alignments             --strict

      - name: Generate lexicon-assisted candidate windows
        run: |
          python scripts/generate_anchor_window_candidates.py \
            --pali-units generated/alignment-source/pali/units.jsonl \
            --chinese-blocks generated/alignment-source/chinese/blocks.jsonl \
            --resolved-crosswalks generated/crosswalks/first-20-resolved.json \
            --lexicon data/alignments/lexicon.json \
            --reviewed-seed data/alignments/model-reviewed.json \
            --output generated/alignments \
            --top-k 3 \
            --max-width 3 \
            --strict

      - name: Validate epistemic guardrails
        run: |
          python scripts/validate_alignments.py             --pali-units generated/alignment-source/pali/units.jsonl             --chinese-blocks generated/alignment-source/chinese/blocks.jsonl             --candidates               generated/alignments/shared-formula-candidates.jsonl               generated/alignments/monotonic-candidates.jsonl             --reviewed data/alignments/reviewed.json data/alignments/model-reviewed.json

      - uses: actions/upload-artifact@v4
        with:
          name: alignment-source-units
          path: |
            generated/alignment-source/
            generated/alignments/

      - name: Commit generated alignment layer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/alignment-source generated/alignments
          if git diff --cached --quiet; then
            echo "Generated alignment layer is unchanged"
            exit 0
          fi
          git commit -m "Refresh Pali-Chinese alignment source units"
          git push
