name: Inspect CBETA Agama structure

on:
  push:
    paths:
      - "scripts/inspect_cbeta_agama_structure.py"
      - ".github/workflows/inspect-cbeta.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Sparse-fetch pinned CBETA Agama XML
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git ls-files -s upstream/cbeta-xml-p5 | awk '{print $2}')"
          rm -rf .cache/cbeta
          mkdir -p .cache/cbeta
          git -C .cache/cbeta init
          git -C .cache/cbeta remote add origin https://github.com/cbeta-org/xml-p5.git
          git -C .cache/cbeta config core.sparseCheckout true
          cat > .cache/cbeta/.git/info/sparse-checkout <<'EOF'
          T/T01/T01n0001.xml
          T/T01/T01n0026.xml
          T/T02/T02n0099.xml
          T/T02/T02n0100.xml
          T/T02/T02n0125.xml
          EOF
          git -C .cache/cbeta fetch --depth 1 --filter=blob:none origin "$SHA"
          git -C .cache/cbeta checkout --detach FETCH_HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe structure
        run: python scripts/inspect_cbeta_agama_structure.py .cache/cbeta
